name: Build additional targets

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    branches:
      - master
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: [self-hosted, macOS, ARM64]
    if: github.event.pull_request.draft == false
    env:
      PROJECT: Nextcloud.xcodeproj
      DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=27.2
      XCODE_VERSION: '27.2'
    steps:
    - uses: actions/checkout@v7
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: ${{ env.XCODE_VERSION }}
    - name: Make sure xcbeautify is available
      run: |
        # The self-hosted Mac Mini may not have xcbeautify. Fall back to plain output instead of failing.
        if ! command -v xcbeautify >/dev/null 2>&1; then
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\ncat\n' > "$RUNNER_TEMP/bin/xcbeautify"
          chmod +x "$RUNNER_TEMP/bin/xcbeautify"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "xcbeautify not installed on this runner; using plain xcodebuild output"
        fi
    - name: Build iOS Share
      run: |
        xcodebuild build -project $PROJECT -scheme "$SCHEME" -destination "$DESTINATION" | xcbeautify --quieter
      env:
          SCHEME: Share
    - name: Build iOS File Extension
      run: |
        xcodebuild build -project $PROJECT -scheme "$SCHEME" -destination "$DESTINATION" | xcbeautify --quieter
      env:
          SCHEME: File Provider Extension
    - name: Build iOS Notification Extension
      run: |
        xcodebuild build -project $PROJECT -scheme "$SCHEME" -destination "$DESTINATION" | xcbeautify --quieter
      env:
          SCHEME: Notification Service Extension
    - name: Build iOS Widget
      run: |
        xcodebuild build -project $PROJECT -scheme "$SCHEME" -destination "$DESTINATION" | xcbeautify --quieter
      env:
          SCHEME: Widget
    - name: Build iOS Widget Dashboard IntentHandler
      run: |
        xcodebuild build -project $PROJECT -scheme "$SCHEME" -destination "$DESTINATION" | xcbeautify --quieter
      env:
          SCHEME: WidgetDashboardIntentHandler
