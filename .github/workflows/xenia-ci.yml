# XeniaCloud CI — unsigned build verification for the xenia-rebrand fork.
# XNT-53. Build-only (no test matrix, no signing) — deliberately narrower than
# upstream's xcode.yml, which also chains into a full Nextcloud-server-backed
# test job.

name: Xenia CI (unsigned build)

on:
  push:
    branches:
      - xenia-rebrand
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT: Nextcloud.xcodeproj
  SCHEME: Nextcloud
  XCODE_VERSION: "26.0.1"

jobs:
  build:
    name: Build (unsigned)
    runs-on: macos-15

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Download GoogleService-Info.plist
      run: wget "https://raw.githubusercontent.com/firebase/quickstart-ios/master/mock-GoogleService-Info.plist" -O GoogleService-Info.plist

    - name: Setup Xcode ${{ env.XCODE_VERSION }}
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: ${{ env.XCODE_VERSION }}

    - name: Build (unsigned, simulator SDK)
      run: |
        set -o pipefail && \
        xcodebuild build \
        -project "${{ env.PROJECT }}" \
        -scheme "${{ env.SCHEME }}" \
        -destination 'generic/platform=iOS Simulator' \
        -derivedDataPath 'DerivedData' \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO \
        CODE_SIGN_IDENTITY="" \
        | xcbeautify --quieter
