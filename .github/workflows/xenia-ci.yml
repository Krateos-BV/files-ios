# XeniaCloud CI — unsigned build verification for the xenia-rebrand fork.
# XNT-53. Build-only (no test matrix, no signing) — deliberately narrower than
# upstream's xcode.yml, which also chains into a full Nextcloud-server-backed
# test job.

name: Xenia CI (unsigned build)

# XNT-215: this triggered on `push: [xenia-rebrand]` until 26 Sep 2026. That branch
# was deleted, so the workflow's only event trigger could never match again — 2 runs
# ever, newest 2026-09-08. It survived XNT-203's rename sweep because a trigger
# naming neither `master` nor `main` contains no literal for that sweep to grep.
#
# Kept rather than deleted despite upstream's xcode.yml already building `main`:
# that build runs on the single `xcode-27` label, so if the label stops being served
# the failure is a queued job — silence, not a red check. This job uses hosted
# `macos-15`, making it the only `main` build signal here with an independent
# failure mode. A weaker build on independent infrastructure beats a stronger one
# behind the same single point of failure.
#
# XNT-215: `pull_request:` carries no `paths:` filter, deliberately. GitHub cannot
# distinguish a required status check that never ran from one still pending — it
# blocks the PR indefinitely either way, with no diagnostic. So a `paths:`-filtered
# or push-only check must never be made required. Every PR compiles even when only
# docs changed; that is the price of a signal that cannot silently go missing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT: Nextcloud.xcodeproj
  SCHEME: Nextcloud
  # Bumped from 26.0.1: the project's SPM graph now needs Swift tools 6.3.0
  # (gzipswift 7.0.0, arrived 2026-09-19 via upstream sync). 26.0.1 ships Swift
  # 6.2.0, so package resolution failed outright. 26.6 is the newest Xcode on any
  # GitHub-hosted image; if it still lacks Swift 6.3 then this fork cannot be
  # built on hosted infrastructure at all. (XNT-215)
  XCODE_VERSION: "26.6"

jobs:
  build:
    name: Build (unsigned)
    runs-on: macos-26

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Download GoogleService-Info.plist
      run: wget "https://raw.githubusercontent.com/firebase/quickstart-ios/master/mock-GoogleService-Info.plist" -O GoogleService-Info.plist

    - name: Setup Xcode ${{ env.XCODE_VERSION }}
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: ${{ env.XCODE_VERSION }}

    - name: Build (unsigned, simulator SDK)
      run: |
        set -o pipefail && \
        xcodebuild build \
        -project "${{ env.PROJECT }}" \
        -scheme "${{ env.SCHEME }}" \
        -destination 'generic/platform=iOS Simulator' \
        -derivedDataPath 'DerivedData' \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO \
        CODE_SIGN_IDENTITY="" \
        | xcbeautify --quieter
